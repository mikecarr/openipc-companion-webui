name: Helper release
on:
  push:
    tags: ['helper-v*']
  pull_request:
    paths: ['helper/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, name: openipc-helper-macos-arm64 }
          - { os: macos-13, target: x86_64-apple-darwin, name: openipc-helper-macos-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: openipc-helper-windows-x64.exe }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: openipc-helper-linux-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --target ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: |
          src=target/${{ matrix.target }}/release/openipc-helper
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: helper/${{ matrix.name }}
  release:
    if: startsWith(github.ref, 'refs/tags/helper-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
